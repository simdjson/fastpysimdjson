name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.10", "3.12", "3.13", "3.14", "3.14t"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Fetch simdjson test data
        uses: actions/checkout@v4
        with:
          repository: simdjson/simdjson-data
          path: simdjson-data

      - name: Install
        run: python -m pip install -v ".[test]"

      - name: Test
        run: python -m pytest tests -v
