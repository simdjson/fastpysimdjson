[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsimdjson"
version = "0.1.0"
description = "Fast JSON parsing for Python, built on simdjson"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
test = ["pytest"]
bench = ["orjson"]
