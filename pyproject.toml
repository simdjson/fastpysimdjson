[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsimdjson"
version = "2.0.1"
description = "Fast JSON parsing for Python, built on simdjson"
readme = "README.md"
authors = [
    {name = "Daniel Lemire", email = "daniel@lemire.me"}
]
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["json", "simdjson", "parser", "simd", "performance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/simdjson/fastpysimdjson"
Repository = "https://github.com/simdjson/fastpysimdjson"
Issues = "https://github.com/simdjson/fastpysimdjson/issues"

[project.optional-dependencies]
test = ["pytest", "msgpack", "typing_extensions"]
bench = ["orjson", "jiter", "msgspec", "pydantic", "cattrs", "pysimdjson", "cysimdjson", "pyarrow", "polars", "duckdb", "msgpack", "ormsgpack"]

[tool.cibuildwheel]
skip = ["pp*"]
test-requires = ["pytest", "msgpack"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.macos]
# Build for Intel, Apple Silicon, and Universal2 binaries
archs = ["x86_64", "universal2", "arm64"]

[tool.cibuildwheel.linux]
# Build for the runner's native architecture (x86_64 and aarch64 runners
# are provided separately in the CI matrix, so each builds natively).
archs = ["native"]

[tool.cibuildwheel.pyodide]
# WebAssembly wheels, one per Pyodide ABI (cp313: Pyodide 0.28 and 0.29;
# cp314: Pyodide 314; cp315). In a Pyodide venv, the pytest script starts
# with a shebang to a shell script, which macOS cannot run: python -m pytest.
test-command = "python -m pytest {project}/tests -q"

[tool.cibuildwheel.windows]
# Build for 64-bit Windows (32-bit is rarely needed nowadays)
archs = ["AMD64"]

[tool.pyodide.build]
# Pyodide's default flags, but -O3 where they end with -Oz (size): dumps and
# dumpb are up to twice as fast, loads up to 15%. ($(...) variables are not
# expanded here, so the flags are spelled out.)
cflags = "-g0 -fPIC -fwasm-exceptions -sSUPPORT_LONGJMP=wasm -O3"
cxxflags = "-g0 -fPIC -fwasm-exceptions -sSUPPORT_LONGJMP=wasm -O3"
ldflags = "-g0 -fwasm-exceptions -sSUPPORT_LONGJMP=wasm -s SIDE_MODULE=1 -O3"
